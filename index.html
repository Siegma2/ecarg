<!doctype html><html><meta charset="utf-8"><title>ecarg movement lab</title><style>body{margin:0;background:#111;color:white;font:16px monospace}canvas{width:100vw;height:100vh;display:block}#ui{position:absolute;top:20px;left:20px}button{padding:14px;background:#ddaabc}</style><canvas id="c"></canvas><div id="ui"><h1>ecarg</h1><button id="go">ENTER / RESUME</button><p>WASD move · Mouse look · Shift sprint<br>Space jump · C slide · Esc pause · R reset</p><span id="status">Movement lab: connected rooms, no entities yet.</span></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),k=new Set(),s=document.querySelector('#status');
const map=['111111111111','100000100001','100000100001','100000000001','100110100001','100000100001','111011111011','100000000001','100110011001','100000000001','111111111111'];
let x=3,y=3,a=0,p=0,z=0,v=0,slide=0,cool=0,t=performance.now();function wall(x,y){return map[Math.floor(y/2)]?.[Math.floor(x/2)]!=='0'}function free(x,y){return !wall(x-.22,y-.22)&&!wall(x+.22,y-.22)&&!wall(x-.22,y+.22)&&!wall(x+.22,y+.22)}
document.querySelector('#go').onclick=()=>c.requestPointerLock();document.addEventListener('pointerlockchange',()=>{k.clear();document.querySelector('#go').hidden=document.pointerLockElement===c});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===c){a+=e.movementX*.0025;p=Math.max(-.65,Math.min(.65,p-e.movementY*.0025))}});document.addEventListener('keydown',e=>{if(document.pointerLockElement!==c)return;e.preventDefault();k.add(e.code);if(e.code==='Space'&&z===0)v=4.8;if((e.code==='KeyC'||e.code==='ControlLeft')&&cool<=0&&k.has('KeyW')){slide=.65;cool=1}if(e.code==='KeyR'){x=3;y=3;a=p=z=v=slide=0}});document.addEventListener('keyup',e=>k.delete(e.code));window.addEventListener('blur',()=>k.clear());function resize(){c.width=Math.min(innerWidth,960);c.height=c.width*innerHeight/innerWidth}onresize=resize;resize();
function frame(now){const dt=Math.min(.03,(now-t)/1000);t=now;if(document.pointerLockElement===c){slide=Math.max(0,slide-dt);cool-=dt;let f=+k.has('KeyW')-+k.has('KeyS'),r=+k.has('KeyD')-+k.has('KeyA'),n=Math.hypot(f,r)||1,speed=slide>0?8:k.has('ShiftLeft')?5.7:3.2;f/=n;r/=n;let dx=(Math.cos(a)*f-Math.sin(a)*r)*speed*dt,dy=(Math.sin(a)*f+Math.cos(a)*r)*speed*dt;const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.08));for(let i=0;i<steps;i++){if(free(x+dx/steps,y))x+=dx/steps;if(free(x,y+dy/steps))y+=dy/steps}v-=12*dt;z+=v*dt;if(z<0)z=v=0;s.textContent=slide>0?'SLIDING':z>0?'AIRBORNE':'EXPLORING'}let w=c.width,h=c.height,mid=h/2+p*h*.6+z*h*.12-(slide>0?h*.12:0),plane=w*.85;g.fillStyle='#15121c';g.fillRect(0,0,w,h);g.fillStyle='#302831';g.fillRect(0,mid,w,h);for(let i=0;i<w;i+=2){let ray=a+Math.atan((i-w/2)/plane),rx=Math.cos(ray),ry=Math.sin(ray),d=.02;while(d<45&&!wall(x+rx*d,y+ry*d))d+=.035;d=Math.max(.02,d*Math.cos(ray-a));let height=plane*2.8/d,b=Math.max(14,140/(1+d*.15)),top=mid-height*.55;g.fillStyle='rgb('+b+','+b*.8+','+b*.9+')';g.fillRect(i,top,2,height);g.fillStyle='#0004';for(let j=1;j<8;j++)g.fillRect(i,top+height*j/8,2,Math.max(1,height*.007))}g.fillStyle='white';g.fillRect(w/2-3,h/2,6,1);g.fillRect(w/2,h/2-3,1,6);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
