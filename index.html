<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ecarg — first run</title><style>body{margin:0;background:#101017;color:#eee;font:15px monospace;overflow:hidden}canvas{display:block}#hud{position:absolute;top:18px;left:22px;pointer-events:none}h1{letter-spacing:8px;margin:0}#clock{font-size:32px;color:#e8bacf}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#080910cc}.card{padding:32px;background:#191620;border:1px solid #aa829b;max-width:430px}button{padding:14px;font:inherit;background:#e8bacf;border:0;cursor:pointer}p{line-height:1.7}#cross{position:absolute;left:50%;top:50%;pointer-events:none}</style><div id="hud"><h1>ecarg</h1><div id="clock">2:30</div><div id="info">Loading 3D engine…</div></div><div id="cross">+</div><div id="menu"><div class="card"><h1>ecarg</h1><p id="note">Start in safety. Reach the next saferoom before time runs out.<br>12 rooms per section. Eight old rooms remain behind you.</p><p>WASD move · Mouse look · Shift sprint<br>C / Ctrl slide · R restart · Esc release cursor<br>No jumping. Look down to see your body.</p><button id="go" disabled>LOADING</button></div></div><script type="module">
try {
const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x101017);scene.fog=new T.Fog(0x101017,14,65);const camera=new T.PerspectiveCamera(80,innerWidth/innerHeight,.04,85);camera.rotation.order='YXZ';const renderer=new T.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xf6dfef,0x55435a,2));const sun=new T.DirectionalLight(0xffe7d3,1.3);sun.position.set(3,8,2);scene.add(sun);
const geo=new T.BoxGeometry(1,1,1),materials={};function material(color){return materials[color]||(materials[color]=new T.MeshLambertMaterial({color}));}function box(group,w,h,d,x,y,z,color){const mesh=new T.Mesh(geo,material(color));mesh.scale.set(w,h,d);mesh.position.set(x,y,z);group.add(mesh);return mesh;}
const rooms=new Map(),keys=new Set(),menu=document.querySelector('#menu'),clock=document.querySelector('#clock'),info=document.querySelector('#info'),note=document.querySelector('#note'),go=document.querySelector('#go');let px=0,pz=4,yaw=0,pitch=0,remaining=150,running=false,dead=false,furthest=0,checkpoint=0,sliding=0,cooldown=0,stride=0,last=performance.now();const L=14;
function addRoom(i){if(rooms.has(i))return;const safe=i%12===0,width=safe?10:8+Math.floor(Math.random()*3)*2,group=new T.Group(),blocks=[];group.position.z=-i*L;scene.add(group);box(group,width,.2,L,0,-.1,0,safe?0x57475e:0x383440);box(group,width,.2,L,0,3.6,0,0x24222e);box(group,.3,3.6,L,-width/2,1.8,0,0x736274);box(group,.3,3.6,L,width/2,1.8,0,0x736274);for(const end of [-L/2,L/2]){box(group,width/2-1.4,3.6,.3,-(width/4+.7),1.8,end,safe?0x968499:0x62556a);box(group,width/2-1.4,3.6,.3,width/4+.7,1.8,end,safe?0x968499:0x62556a);box(group,2.8,.5,.3,0,3.35,end,0xa18c9d);}box(group,2,.04,1,0,3.45,0,safe?0x99e8c2:0xe8bacf);if(!safe){const count=1+Math.floor(Math.random()*3);for(let n=0;n<count;n++){const bx=(n%2?1:-1)*(2+Math.random()*(width/2-3)),bz=-3+n*3;box(group,1.1,2,1.4,bx,1,bz,0x534958);blocks.push({x:bx,z:-i*L+bz,w:.55,d:.7});}}else{box(group,2,.6,.8,-width/2+1.3,.3,2,0xafa4b7);}rooms.set(i,{group,width,blocks,safe});}
function ensure(){for(let i=Math.max(0,furthest-8);i<=furthest+3;i++)addRoom(i);for(const [i,r]of rooms){if(i<furthest-8){scene.remove(r.group);rooms.delete(i);}}}
function roomAt(z){return Math.max(0,Math.floor((-z+L/2)/L));}
function canMove(x,z){const i=roomAt(z),room=rooms.get(i);if(!room||z>L/2-.3)return false;const radius=.27;if(Math.abs(x)>room.width/2-.2-radius)return false;const local=z+i*L;if(Math.abs(local)>L/2-.3-radius&&Math.abs(x)>1.4-radius)return false;for(const b of room.blocks){if(Math.abs(x-b.x)<b.w+radius&&Math.abs(z-b.z)<b.d+radius)return false;}return true;}
const body=new T.Group();scene.add(body);box(body,.68,.68,.34,0,1.08,0,0x843f60);const arms=[box(body,.25,.7,.28,-.49,1.07,0,0xe7ccbd),box(body,.25,.7,.28,.49,1.07,0,0xe7ccbd)],legs=[box(body,.29,.72,.3,-.18,.36,0,0x323047),box(body,.29,.72,.3,.18,.36,0,0x323047)];
function reset(){for(const r of rooms.values())scene.remove(r.group);rooms.clear();px=0;pz=4;yaw=pitch=0;remaining=150;running=dead=false;furthest=checkpoint=0;sliding=cooldown=stride=0;ensure();note.textContent='Start in safety. Leave to start the 2:30 timer. Next saferoom: room 12.';go.textContent='ENTER / RESUME';}
function fail(){dead=true;running=false;document.exitPointerLock();note.textContent='TIME EXPIRED. The run is over. Restart from the first saferoom.';go.textContent='RETRY';menu.style.display='grid';}
go.disabled=false;go.textContent='ENTER / RESUME';go.onclick=()=>{if(dead)reset();renderer.domElement.requestPointerLock();};document.addEventListener('pointerlockchange',()=>{keys.clear();menu.style.display=document.pointerLockElement===renderer.domElement?'none':'grid';});document.addEventListener('pointerlockerror',()=>{note.textContent='Mouse capture was blocked. Click ENTER again in a desktop browser.';});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.45,Math.min(1.3,pitch-e.movementY*.0025));}});document.addEventListener('keydown',e=>{if(document.pointerLockElement!==renderer.domElement)return;if(['Space','ControlLeft','ControlRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='KeyR')reset();if(!e.repeat&&(e.code==='KeyC'||e.code.startsWith('Control'))&&cooldown<=0&&keys.has('KeyW')){sliding=.7;cooldown=1.1;}});document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();if(document.pointerLockElement)document.exitPointerLock();}});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
reset();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const active=document.pointerLockElement===renderer.domElement&&!dead;let moving=false;if(active){sliding=Math.max(0,sliding-dt);cooldown-=dt;let f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),r=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),len=Math.hypot(f,r)||1;f/=len;r/=len;moving=!!(f||r);const speed=sliding>0?9:keys.has('ShiftLeft')||keys.has('ShiftRight')?6.5:4.2,dx=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt,steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.08));for(let n=0;n<steps;n++){if(canMove(px+dx/steps,pz))px+=dx/steps;if(canMove(px,pz+dz/steps))pz+=dz/steps;}const i=roomAt(pz);if(i>furthest){furthest=i;ensure();}if(i>checkpoint&&i%12===0){checkpoint=i;remaining=150;running=false;}else if(i>checkpoint&&!running)running=true;if(running){remaining=Math.max(0,remaining-dt);if(remaining===0)fail();}}
const low=sliding>0;body.position.set(px+Math.sin(yaw)*.14,low?-.5:0,pz+Math.cos(yaw)*.14);body.rotation.y=yaw;stride+=moving?dt*11:0;for(let n=0;n<2;n++){legs[n].rotation.x=moving&&!low?Math.sin(stride+n*Math.PI)*.4:low?-.6:0;arms[n].rotation.x=moving&&!low?-Math.sin(stride+n*Math.PI)*.3:low?-.9:0;}camera.position.set(px,low?1.03:1.68,pz);camera.rotation.set(pitch,yaw,0,'YXZ');const seconds=Math.ceil(remaining);clock.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');info.textContent=(dead?'RUN OVER':running?'RUNNING':'SAFEROOM — TIMER PAUSED')+' / ROOM '+roomAt(pz)+' / NEXT SR '+(checkpoint+12)+' / '+rooms.size+' ROOMS LOADED';renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
} catch(error){document.querySelector('#info').textContent='3D engine could not start';document.querySelector('#note').textContent='Loading failed: '+error.message+'. Check that the browser supports WebGL and can reach cdn.jsdelivr.net.';}
</script></html>
